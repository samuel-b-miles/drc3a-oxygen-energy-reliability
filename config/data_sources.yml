recommended_private_local_staging:
  raw:
    path: data/raw/private/
    contents: original survey exports and canonical data files restored from Drive
  clean:
    path: data/clean/private/
    contents: one-row-per-facility analytical datasets and respondent-level datasets after de-identification review
  intermediate:
    path: data/intermediate/private/
    contents: deduplication candidates, conflict audits, free-text coding workbooks

recommended_public_release_policy:
  include:
    - aggregate tables
    - final figures
    - code
    - data dictionaries
    - anonymization protocol
    - synthetic or minimized analytical data if approved
  exclude:
    - raw survey exports
    - names
    - emails
    - phone numbers
    - exact facility crosswalks
    - raw facility identifiers
    - respondent-level free text
    - duplicate cluster audit files
