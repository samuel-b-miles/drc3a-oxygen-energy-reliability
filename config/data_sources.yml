# Canonical references and release boundaries. No personal local paths or secrets.
project: drc3a-oxygen-energy-reliability
last_reviewed: 2026-10-11
repository_visibility: public
canonical_architecture:
  url: https://docs.google.com/document/d/13LBWbhEQXUHgIoJG5yUJeGUv1tPWAJipoJqkdq2GuSs/edit
source_of_truth:
  originals: authoritative Drive and source-repository locations; locally staged bytes are hash-verified copies
  calculations: this Git repository
collections:
  ndosho:
    id: N001
    manifest: data/collections/ndosho/collection_manifest.json
    components:
      historical_grid_generator: data/collections/ndosho/historical/source_manifest.json
      generator_and_fuel_registers: data/collections/ndosho/generator_register/source_manifest.json
      hopmeter: data/collections/ndosho/hopmeter/source_manifest.json
      paired_powerwatch: data/collections/ndosho/powerwatch/coverage_request.json
    controlled_inputs: data/raw/private/ndosho/
  goma_event:
    manifest: data/collections/goma/powerwatch/export_manifest.json
    public_registry: data/collections/goma/powerwatch/series_registry.json
    controlled_registry: config/private/powerwatch_registry.json
    controlled_inputs: data/raw/private/goma/powerwatch/
    scope: all returned series for the nine user-specified sites; complete census of additional Goma sites not established
  drc2:
    manifest: outputs/drc2_failure_audit/source_manifest.json
    original_export: data/raw/private/drc2/original_survey_export.csv
    augmented_drive_export: data/raw/private/drc2/raw_submissions.csv
    controlled_answer_audit: outputs/private/drc2_failure_audit/
    released_results: outputs/drc2_failure_audit/
    source_shape: 565 submissions and 128 original fields
    facility_denominator: 491
release_policy:
  include: [code, aggregate survey tables, deidentified electrical derivatives, credited source manifests, hashes, schemas, figures]
  exclude: [raw survey answers, names and contacts in annotations, respondent identifiers, facility and sensor identity crosswalks, precise locations, credentials, signed download URLs]
